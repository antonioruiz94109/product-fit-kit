name: Publish check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every category
        run: node scripts/publish-check.js
      - name: Exercise validation and filtering rules
        run: node --test tests/core.test.js
